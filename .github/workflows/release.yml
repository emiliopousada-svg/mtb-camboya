name: Publish Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag and source branch
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::El tag $RELEASE_TAG no coincide con package.json ($VERSION)."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::La release debe salir de un commit integrado en main."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        run: node --test tests/*.test.js

      - name: Prepare web assets
        run: npm run prepare-web

      - name: Add tracking notification resources
        run: |
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/values
          cp android-res/ic_tracking.xml android/app/src/main/res/drawable/ic_tracking.xml
          cp android-res/tracking.xml android/app/src/main/res/values/tracking.xml

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Load and verify signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/mtb-camboya-release.keystore
          EXPECTED_CERT_SHA256: 2b429c7f9244e5d45e11678939a420501ea8844d1da98e775281aa8fa6b6fd5f
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Falta el secret DEBUG_KEYSTORE_B64 en GitHub Actions."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SIGNING_KEYSTORE_PATH"
          ACTUAL_CERT_SHA256=$(keytool -list -v -keystore "$SIGNING_KEYSTORE_PATH" -storepass android -alias androiddebugkey \
            | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::La clave configurada no coincide con el certificado esperado."
            exit 1
          fi

      - name: Build and verify signed APK
        env:
          MTB_SIGNING_STORE_FILE: ${{ runner.temp }}/mtb-camboya-release.keystore
          MTB_SIGNING_STORE_PASSWORD: android
          MTB_SIGNING_KEY_ALIAS: androiddebugkey
          MTB_SIGNING_KEY_PASSWORD: android
          ANDROID_BUILD_NUMBER: ${{ github.run_number }}
          EXPECTED_CERT_SHA256: 2b429c7f9244e5d45e11678939a420501ea8844d1da98e775281aa8fa6b6fd5f
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          RELEASE_BUILD_NUMBER=$((100000 + ANDROID_BUILD_NUMBER))
          (cd android && ./gradlew -PandroidBuildNumber="$RELEASE_BUILD_NUMBER" assembleRelease)
          APK="android/app/build/outputs/apk/release/app-release.apk"
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$ANDROID_SDK" ]; then
            echo "::error::No se encontró Android SDK para verificar el APK."
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER" && test -f "$APK"
          APKSIGNER_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)
          printf '%s\n' "$APKSIGNER_OUTPUT"
          APK_CERT_SHA256=$(printf '%s\n' "$APKSIGNER_OUTPUT" \
            | sed -nE 's/.*certificate SHA-256 digest:[[:space:]]*([[:xdigit:]:]+).*/\1/ip' \
            | sed -n '1p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ "$APK_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::La firma del APK no coincide con el certificado esperado."
            exit 1
          fi
          RELEASE_APK="mtb-camboya-${RELEASE_TAG}.apk"
          cp "$APK" "$RELEASE_APK"
          sha256sum "$RELEASE_APK" > "$RELEASE_APK.sha256"
          echo "release_apk=$RELEASE_APK" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: actions/github-script@v9
        env:
          RELEASE_APK: mtb-camboya-${{ github.ref_name }}.apk
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = process.env.RELEASE_TAG;
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `MTB Camboya ${tag}`,
              draft: true,
              generate_release_notes: true
            });

            for (const file of [process.env.RELEASE_APK, `${process.env.RELEASE_APK}.sha256`]) {
              const stat = fs.statSync(file);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name: path.basename(file),
                data: fs.readFileSync(file),
                headers: {
                  'content-type': file.endsWith('.sha256') ? 'text/plain' : 'application/vnd.android.package-archive',
                  'content-length': stat.size
                }
              });
            }

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              draft: false
            });
            console.log(`Published ${release.html_url}`);
