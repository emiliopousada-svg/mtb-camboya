name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar la web (copias locales de Leaflet y Chart.js, Bluetooth)
        run: node scripts/prepare-web.js

      - name: Leer versión de la app
        id: app-version
        run: node -e 'require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "version=" + require("./package.json").version + "\n")'

      - name: Recursos de notificación de tracking
        run: |
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/values
          cp android-res/ic_tracking.xml android/app/src/main/res/drawable/ic_tracking.xml
          cp android-res/tracking.xml android/app/src/main/res/values/tracking.xml

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Firma fija (necesaria para poder actualizar la app)
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Falta el secret DEBUG_KEYSTORE_B64 (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          mkdir -p ~/.android
          printf '%s' "$KEYSTORE_B64" | base64 --decode > ~/.android/debug.keystore
          ACTUAL_CERT_SHA256=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
            | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          EXPECTED_CERT_SHA256=2b429c7f9244e5d45e11678939a420501ea8844d1da98e775281aa8fa6b6fd5f
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::DEBUG_KEYSTORE_B64 no coincide con la firma APK esperada. Restaura el keystore original de la build #88."
            echo "::error::Huella SHA-256 encontrada: ${ACTUAL_CERT_SHA256:-no disponible}"
            exit 1
          fi
          echo "Certificado de firma verificado: $ACTUAL_CERT_SHA256"

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: mtb-camboya-apk-v${{ steps.app-version.outputs.version }}-run-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
