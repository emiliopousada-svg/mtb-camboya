name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Preparar la web (copias locales de Leaflet y Chart.js)
        run: node scripts/prepare-web.js

      - name: Crear proyecto Android limpio con la versión de Capacitor del proyecto
        run: |
          rm -rf android
          npx cap add android

      - name: Permisos (ubicación, notificación y servicio en segundo plano)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for permission in ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION POST_NOTIFICATIONS FOREGROUND_SERVICE FOREGROUND_SERVICE_LOCATION; do
            if ! grep -q "android.permission.$permission" "$MANIFEST"; then
              sed -i "/<application/i\    <uses-permission android:name=\"android.permission.$permission\" />" "$MANIFEST"
            fi
          done
          grep -q FOREGROUND_SERVICE_LOCATION "$MANIFEST"
          grep -q ACCESS_FINE_LOCATION "$MANIFEST"

      - name: Icono y texto de la notificación de grabación
        run: |
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/values
          cp android-res/ic_tracking.xml android/app/src/main/res/drawable/ic_tracking.xml
          cp android-res/tracking.xml android/app/src/main/res/values/tracking.xml

      - name: Sincronizar
        run: npx cap sync android

      - name: Asignar versión automática de la aplicación
        run: |
          VERSION_CODE=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          VERSION_NAME="1.2.${GITHUB_RUN_NUMBER}"
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${VERSION_CODE}/; s/versionName[[:space:]]+['\"][^'\"]*['\"]/versionName '${VERSION_NAME}'/" android/app/build.gradle
          grep -q "versionCode ${VERSION_CODE}" android/app/build.gradle
          grep -q "versionName '${VERSION_NAME}'" android/app/build.gradle
          echo "Versión de MTB CAMBOYA: ${VERSION_NAME} (${VERSION_CODE})"

      - name: Firma fija (necesaria para poder actualizar la app)
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Falta el secret DEBUG_KEYSTORE_B64 (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: mtb-camboya-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
