name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Preparar la web (copias locales de Leaflet y Chart.js)
        run: node scripts/prepare-web.js

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Permisos de ubicación
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i \
            -e '/android.permission.INTERNET/a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' \
            -e '/android.permission.INTERNET/a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' \
            "$MANIFEST"
          grep -q ACCESS_FINE_LOCATION "$MANIFEST"

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: mtb-camboya-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
